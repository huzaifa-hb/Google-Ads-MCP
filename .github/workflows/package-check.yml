name: Package Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed package resources
        run: |
          python - <<'PY'
          from google_ads_mcp.resources import gaql_knowledge_base_resource, tool_catalog_resource

          assert "Google Ads MCP Tool Catalog" in tool_catalog_resource()
          assert "GAQL Knowledge Base" in gaql_knowledge_base_resource()
          PY
