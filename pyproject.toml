[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-mcp"
version = "0.4.2"
description = "Cloud Run-ready MCP server exposing Google Ads API tools for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "cryptography>=42.0.0",
    "fastmcp>=2.13.1,<4",
    "google-ads>=28.0.0",
    "google-auth>=2.29.0",
    "google-cloud-firestore>=2.20.0",
    "protobuf>=4.25.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.0.1",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2.1",
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
setup = [
    "google-auth-oauthlib>=1.2.0",
    "keyring>=25.0.0",
]

[project.scripts]
google-ads-mcp = "google_ads_mcp.__main__:main"
google-ads-mcp-auth = "google_ads_mcp.auth_setup:main"
google-ads-mcp-stdio-relay = "google_ads_mcp.stdio_relay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
google_ads_mcp = ["default_tools_config.yaml", "resources_data/*.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
